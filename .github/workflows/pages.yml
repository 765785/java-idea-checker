name: Publish Windows checker
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Test
        run: node --test tests/*.test.js
      - name: Build offline distribution
        run: node tools/build-offline.js
      - name: Verify offline distribution
        run: node tools/build-offline.js --check
      - name: Prepare site
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path _site -Force | Out-Null
          Copy-Item index.html,README.md -Destination _site
          Copy-Item assets -Destination _site -Recurse
          Copy-Item dist -Destination _site -Recurse
          New-Item -ItemType File -Path _site/.nojekyll | Out-Null
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
